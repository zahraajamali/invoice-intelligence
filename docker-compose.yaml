services:
  # === Flask App: Invoice Analyzer ===
  invoice-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-analyzer
    ports:
      - "${FLASK_PORT:-5000}:${FLASK_PORT:-5000}"
    env_file:
      - .env
    volumes:
      - ./datasets:/app/datasets
      - ./ocr_output:/app/ocr_output
      - ./formatted_output:/app/formatted_output
    depends_on:
      - neo4j
    restart: unless-stopped

  # === Neo4j Graph DB ===
  neo4j:
    image: neo4j:5.16
    container_name: neo4j-invoice-db
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:${NEO4J_HTTP_PORT:-7474}" # Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:${NEO4J_BOLT_PORT:-7687}" # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  neo4j-data:
